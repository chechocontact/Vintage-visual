name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write   # only used to publish a release when a version tag is pushed
    steps:
      - uses: actions/checkout@v7

      - name: Read product version from CMakeLists.txt
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(VintageVisual VERSION ([0-9.]+)'
          if (-not $m) { throw 'Version not found in CMakeLists.txt' }
          $v = $m.Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME does not match the CMake version v$v"
          }

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.value }}" "/DBuildDir=$PWD\build\VintageVisual_artefacts\Release\VST3" installer\VintageVisual.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@v7
        with:
          name: VintageVisual-Setup-windows
          path: dist/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: VintageVisual-VST3-windows
          path: build/VintageVisual_artefacts/Release/VST3/Vintage Visual.vst3

      # Push a tag such as v0.1.0 (it must match the CMake version) to publish the installer as a GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" $exe --title "Vintage Visual $env:GITHUB_REF_NAME" --generate-notes
